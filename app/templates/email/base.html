<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f6f9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f6f9;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:8px;">
        <tr>
          <td style="padding:24px 32px;border-bottom:1px solid #e5eaf0;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:bold;color:#10263f;">
            PickA<span style="color:#0a9b53;">Sparky</span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#10263f;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;border-top:1px solid #e5eaf0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#5b6b7d;">
            PickASparky &middot; <a href="{{ frontend_url }}" style="color:#0a9b53;">{{ frontend_url }}</a><br>
            Questions? Email <a href="mailto:{{ support_email }}" style="color:#0a9b53;">{{ support_email }}</a>.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
