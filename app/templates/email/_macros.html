{% macro button(url, label) %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td style="background-color:#0a9b53;border-radius:6px;">
      <a href="{{ url }}" style="display:inline-block;padding:12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ label }}</a>
    </td>
  </tr>
</table>
{% endmacro %}

{% macro answers_table(answers) %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:16px 0;border-top:1px solid #e5eaf0;">
  {% for question, answer in answers %}
  <tr>
    <td width="40%" style="padding:8px 8px 8px 0;border-bottom:1px solid #e5eaf0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#5b6b7d;vertical-align:top;">{{ question }}</td>
    <td style="padding:8px 0;border-bottom:1px solid #e5eaf0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#10263f;vertical-align:top;">{{ answer }}</td>
  </tr>
  {% endfor %}
</table>
{% endmacro %}
