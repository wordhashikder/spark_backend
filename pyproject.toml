[project]
name = "pickasparky-backend"
version = "1.0.0"
description = "PickASparky marketplace API: matches UK homeowners with vetted EV charger installers."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "aiosmtplib>=5.1.3",
    "cloudinary>=1.46.2",
    "stripe>=16.0.0",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
    "limits>=5.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF", "PT", "DTZ", "T20"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() defaults are evaluated per request by design
]

[tool.ruff.lint.isort]
# The local `alembic/` migration directory must not shadow the installed package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/versions/**" = ["E501"]
"app/cli.py" = ["T201"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
